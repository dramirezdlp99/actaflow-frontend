name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de dependencias de produccion
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build de produccion
        run: npm run build
